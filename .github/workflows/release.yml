name: Release

# Push a tag like v0.1.0 to build and publish everything:
# PyPI, a GitHub release with the .deb, and the signed apt repository on GitHub Pages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check the tag matches the version
        run: |
          version=$(PYTHONPATH=src python -c 'import debscout; print(debscout.__version__)')
          deb_version=$(dpkg-parsechangelog -S Version 2>/dev/null || sed -n '1s/.*(\(.*\)).*/\1/p' debian/changelog)
          echo "tag=${GITHUB_REF_NAME} python=${version} debian=${deb_version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "${deb_version%-*}" = "${version}"

  python:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: dist/

  deb:
    needs: test
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git debhelper dh-python \
            pybuild-plugin-pyproject python3-all python3-setuptools
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p out
          mv ../debscout_*.deb out/
          dpkg-deb --info out/*.deb
          dpkg-deb --contents out/*.deb
      - name: Install and run it
        run: |
          apt-get install -y ./out/*.deb
          debscout --version
          debscout --help > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: out/*.deb

  pypi:
    needs: [python, deb]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/debscout
    permissions:
      id-token: write  # PyPI trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [python, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "debscout ${GITHUB_REF_NAME#v}" \
            --notes "Install from the apt repository: https://iam-super-user.github.io/debscout/ or with: pipx install debscout"

  apt-repo:
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: debs/
      - name: Build the signed apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg xz-utils
          sh scripts/build-apt-repo.sh debs site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
